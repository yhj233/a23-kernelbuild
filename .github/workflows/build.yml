name: Build A23 mainline kernel + U-Boot (Lima GPU + FB console)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout build repo (config + boot.cmd)
        uses: actions/checkout@v4
        with:
          path: build-repo

      - name: Install cross toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            gcc-arm-linux-gnueabihf \
            binutils-arm-linux-gnueabihf \
            bc bison flex libssl-dev libelf-dev \
            u-boot-tools device-tree-compiler

      # ---------- U-Boot (A23 Q8 800x480, 正确的 DRAM/LCD 初始化) ----------
      - name: Fetch U-Boot v2022.01 (shallow)
        run: |
          git clone --depth 1 --branch v2022.01 \
            https://github.com/u-boot/u-boot.git uboot

      - name: Build A23 U-Boot with SPL (hardcoded bootcmd, no keyboard/distro-scan)
        run: |
          cd uboot
          make q8_a23_tablet_800x480_defconfig

          # CONFIG_BOOTCOMMAND 是 C 宏(#ifndef ... #define 在 include/config_distro_bootcmd.h)，
          # 不是 Kconfig 选项，写 .config 无效。必须 patch 源码。
          # 写死 bootcmd：直接从 FAT p1 加载 dtb+zImage 并 bootz，绕过 distro boot 扫描
          # 键盘不可用、无法现场确认 SD 卡是 mmc 0 还是 1，所以两个设备号+分区号都探测
          # rootfs 已换成 Maemo Leste 桌面：正常启动 /sbin/init -> S02xorg -> hildon-desktop
          # 不带 init=/bin/bash、不带 console=tty0/fbcon（让出 framebuffer 给 Xorg）
          # 用仓库里的独立脚本 patch（避开 YAML 缩进 / shell 转义问题）
          python3 ../build-repo/patch_bootcmd.py
          echo "=== patch 后确认 ==="
          grep -n 'define CONFIG_BOOTCOMMAND' include/config_distro_bootcmd.h | head -2
          make -j$(nproc) CROSS_COMPILE=arm-linux-gnueabihf-
          echo "=== U-Boot 产物 ==="
          ls -lh u-boot-sunxi-with-spl.bin
          echo "=== defconfig 确认 ==="
          grep -E 'CONFIG_(MACH_SUN8I_A23|DRAM_CLK|DEFAULT_DEVICE_TREE|VIDEO_LCD_MODE|BOOTCOMMAND)=' .config

      # ---------- Kernel (Lima GPU + framebuffer console) ----------
      - name: Fetch mainline kernel v6.1 (shallow)
        run: |
          git clone --depth 1 --branch v6.1 \
            https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git linux
          echo "KVER=$(cd linux && make kernelversion)" >> $GITHUB_ENV

      - name: Install config
        run: |
          cp build-repo/kernel.config linux/.config
          cd linux
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- olddefconfig
          echo "=== 关键选项确认 ==="
          grep -E '^CONFIG_(FB|FB_SIMPLE|FRAMEBUFFER_CONSOLE|DRM_LIMA|VT_CONSOLE)=' .config || true

      - name: Build zImage
        run: |
          cd linux
          make -j$(nproc) ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- zImage

      # ---------- DTB: 用 U-Boot 生成的版本 (含 simple-framebuffer, 作者推荐) ----------
      - name: Use U-Boot-generated DTB
        run: |
          mkdir -p artifacts
          cp uboot/arch/arm/dts/sun8i-a23-q8-tablet.dtb artifacts/
          echo "=== dtb 里的 framebuffer 节点 ==="
          strings artifacts/sun8i-a23-q8-tablet.dtb | grep -iE 'framebuffer|simple-fb' || echo "(U-Boot dtb 运行时动态加 simple-framebuffer)"

      - name: Generate boot.scr
        run: |
          mkimage -C none -A arm -T script -d build-repo/boot.cmd artifacts/boot.scr

      - name: Stage artifacts
        run: |
          cp linux/arch/arm/boot/zImage artifacts/
          cp uboot/u-boot-sunxi-with-spl.bin artifacts/
          cp linux/.config artifacts/kernel-final.config
          ls -lh artifacts/
          echo "=== zImage magic ==="
          xxd -l 40 artifacts/zImage
          echo "=== u-boot magic (期望 eGON.BT0) ==="
          xxd -s 32 -l 16 artifacts/u-boot-sunxi-with-spl.bin

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: a23-boot-${{ env.KVER }}
          path: artifacts/*
          retention-days: 90
